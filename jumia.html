
       <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumia Clone - Projet Groupe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="logo">JUMIA</div>
            <input type="text" placeholder="Cherchez un produit, une marque..." class="search-bar">
            <div class="user-menu">Se connecter / Panier</div>
        </div>
    </header>

    <main class="container layout">
        <aside class="categories">
            <ul>
                <li>Supermarché</li>
                <li>Téléphone & Tablette</li>
                <li>Électroménager</li>
            </ul>
        </aside>

        <section class="products-grid">
            <p>Bientôt vos produits ici...</p>
        </section>
    </main><div class="product-card">
    <div class="product-image">
        <img src="https://via.placeholder.com/150" alt="Smartphone">
    </div>
    <div class="product-details">
        <h4>Smartphone Samsung Galaxy</h4>
        <p class="price">120 000 FCFA</p>
        <button class="add-btn">Acheter</button>
    </div>
</div>
<section class="products-grid">
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Smartphone">
        <h4>Smartphone Samsung Galaxy</h4>
        <p class="price">120 000 FCFA</p>
        <button class="add-btn">Acheter</button>
    </div>
</section>


</body>
</html>
